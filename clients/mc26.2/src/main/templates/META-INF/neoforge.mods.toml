modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mixins]]
config="gumiho.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
iconFile="assets/gumiho/icon.png"
authors="MystF"
description='''
An orange, bilingual fox-spirit client mod for private, consent-based Minecraft servers.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

[[mods]]
modId="gumiho_link"
version="${mod_version}"
displayName="GUMIHO Link | 구미호"
authors="MystF"
description="Opt-in teammate sharing. Local development candidate; no combat automation."

[[dependencies.gumiho_link]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.gumiho_link]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"
