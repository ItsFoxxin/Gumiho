name: Development CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Version and repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/check-version.mjs
      - run: node scripts/check-repository.mjs

  relay:
    name: Link relay tests
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run dependency-free relay suite
        working-directory: relay
        run: npm test

  client:
    name: Client checks - Minecraft ${{ matrix.minecraft }}
    needs: policy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.21.1'
            java: '21'
            project: clients/mc1.21.1
          - minecraft: '26.2'
            java: '25'
            project: clients/mc26.2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Run compilation and every regression suite
        working-directory: ${{ matrix.project }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon check
